name: Build (Windows)

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST QMAKE QT6_DIR QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $env:QT6_DIR = $env:QT_ROOT_DIR
          $env:QMAKE = "$env:QT_ROOT_DIR/bin/qmake.exe"
          cargo build --release
