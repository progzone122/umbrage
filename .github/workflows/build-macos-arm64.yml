name: Build (macOS ARM64)

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-macos-arm64-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Qt >= 6.11 is required: 6.10 headers don't compile with the Xcode 26
      # SDK (missing arm_acle.h include in qyieldcpu.h). Since 6.11 the macOS
      # kits are universal and shipped under the clang_64 name.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          arch: clang_64
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          RCC: ${{ env.QT_ROOT_DIR }}/libexec/rcc
